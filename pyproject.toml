[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tapbot"
version = "0.1.0"
description = "Hardware-independent control core for TapBot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "Pillow>=10.4",
    "pyserial>=3.5",
    "uvicorn>=0.30",
]

[project.scripts]
tapbot-grbl-check = "tapbot.robot.hardware_check:main"
tapbot-api = "tapbot.app:main"

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8.0",
]
publish = [
    "google-api-python-client>=2.149",
    "google-auth>=2.35",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "infra/tests"]
pythonpath = ["backend", "."]
addopts = "-ra -m 'not hardware'"
markers = [
    "hardware: requires a connected physical Android device, camera, or robot",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/tapbot"]
