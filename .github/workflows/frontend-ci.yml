name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate and package frontend
        run: python infra/ci/frontend.py --artifact-dir artifacts/frontend
      - uses: actions/upload-artifact@v7
        with:
          name: tapbot-frontend
          path: artifacts/frontend/tapbot-frontend.zip
          if-no-files-found: error
          retention-days: 14
