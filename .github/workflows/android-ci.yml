name: Android Agent CI

on:
  push:
    paths:
      - "android-agent/**"
      - "infra/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android-agent/**"
      - "infra/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate and package Android Agent
        run: python infra/ci/android.py --artifact-dir artifacts/android
      - uses: actions/upload-artifact@v7
        with:
          name: tapbot-android-agent-debug-apk
          path: artifacts/android/tapbot-android-agent-debug.apk
          if-no-files-found: error
          retention-days: 14
