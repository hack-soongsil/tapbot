name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "pyproject.toml"
      - "infra/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "pyproject.toml"
      - "infra/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate and package backend
        run: python infra/ci/backend.py --artifact-dir artifacts/backend
      - uses: actions/upload-artifact@v7
        with:
          name: tapbot-backend-wheel
          path: artifacts/backend/*.whl
          if-no-files-found: error
          retention-days: 14
